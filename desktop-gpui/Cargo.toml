[package]
name = "metra-gpui"
version = "0.5.18"
edition = "2024"
publish = false

[dependencies]
metra = { path = "..", default-features = false }
gpui-kit = "=0.11.0"
async-channel = "2"
chrono = "0.4"
icu_datetime = "=2.4.0"
icu_decimal = { version = "=2.4.0", features = ["unstable"] }
icu_experimental = "=0.7.0"
icu_locale = "=2.4.0"
fixed_decimal = "=0.7.3"
raw-window-handle = "0.6"
notify = "8.2"
auto-launch = "0.5"
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 0

[dev-dependencies]
tempfile = "3"

[features]
native-smoke = []

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "=0.3.7"
