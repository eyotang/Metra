[package]
name = "metra-gpui"
version = "0.5.18"
edition = "2024"
publish = false

[dependencies]
metra = { path = "..", default-features = false }
gpui-kit = "=0.11.0"
async-channel = "2"
chrono = "0.4"
notify = "8.2"
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 0

[dev-dependencies]
tempfile = "3"
