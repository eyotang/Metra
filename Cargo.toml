[package]
name = "metra"
version = "0.5.9"
description = "Cursor, Codex and Claude Code usage monitor built with Tauri 2"
authors = ["eyotang"]
edition = "2024"
license = "MIT"
default-run = "metra"

[lib]
name = "metra_lib"

[features]
default = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop-smoke = ["desktop", "dep:objc2", "dep:objc2-app-kit", "dep:png"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:auto-launch", "dep:x11rb", "dep:windows-sys"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"], optional = true }
auto-launch = { version = "0.5", optional = true }
sys-locale = "0.3"
minisign-verify = "0.2.5"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", optional = true }
objc2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
png = { version = "0.18", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"], optional = true }

[profile.dev]
debug = 0
strip = "none"

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true

# Keep host-side macro dylibs loadable with Apple's current linker.
[profile.release.build-override]
strip = "none"
