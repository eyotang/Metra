name: Native GPUI checks and releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
concurrency:
  group: metra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libvulkan-dev libxkbcommon-x11-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libfontconfig1-dev libx11-xcb-dev libwayland-dev libasound2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - name: Windows collector protocol contract
        if: runner.os == 'Windows'
        run: cargo test --locked --no-default-features --lib providers::codex::boundary_tests
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --features ui-tests --all-targets
      - name: Build collector without the desktop framework
        run: cargo build --locked --no-default-features --target-dir target/collector
      - name: Omarchy presentation and headless protocol
        if: runner.os == 'Linux'
        run: node scripts/verify-omarchy.mjs target/collector/debug/metra
      - name: Omarchy presentation
        if: runner.os != 'Linux'
        run: node scripts/verify-omarchy.mjs
      - name: Validate release signing tool
        run: cargo test --locked --manifest-path tools/release-sign/Cargo.toml

  release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libvulkan-dev libxkbcommon-x11-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libfontconfig1-dev libx11-xcb-dev libwayland-dev libasound2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Require the release tag to match Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Universal macOS application and DMG
        if: runner.os == 'macOS'
        run: node scripts/package-native.mjs --universal
      - name: Linux Debian package
        if: runner.os == 'Linux'
        run: node scripts/package-native.mjs
      - name: Standalone Omarchy collector and widget
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked --no-default-features --target-dir target/collector
          METRA_COLLECTOR_BINARY=target/collector/release/metra node scripts/package-omarchy.mjs
      - name: Windows installer and portable application
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
        run: |
          if (-not (Test-Path $env:MAKENSIS)) { choco install nsis --no-progress -y }
          node scripts/package-native.mjs
      - name: Sign Windows updater with the existing release key
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          cargo run --locked --manifest-path tools/release-sign/Cargo.toml -- "release-assets/Metra-$version-windows-x64-setup.exe"
          $env:METRA_UPDATER_ARTIFACT = "release-assets/Metra-$version-windows-x64-setup.exe"
          $env:METRA_UPDATER_SIGNATURE = "$env:METRA_UPDATER_ARTIFACT.sig"
          cargo test --locked --no-default-features --test updater_signature_contract release_artifact_matches_embedded_public_key -- --ignored --exact
      - uses: actions/upload-artifact@v7
        with:
          name: metra-release-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-artifacts
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: metra-release-*
          merge-multiple: true
          path: release-assets
      - name: Generate the compatible updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/generate-latest-json.mjs --assets-dir release-assets --output release-assets/latest.json --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "Metra ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
