name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Localization contract
        run: npm run verify:i18n
      - name: Package-manager contract
        run: npm run verify:package-manager
      - name: Windows PowerShell 5.1 syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $scripts = @('scripts/build-portable.ps1', 'scripts/verify-rendered-bubble.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Windows UI contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-ui-contract.ps1
      - name: Provider color contract
        run: npm run verify:color
      - name: Bubble visibility contract
        run: npm run verify:visibility
      - name: Bubble click gesture contract
        run: npm run verify:bubble-click
      - name: Bubble snap and idle geometry
        run: npm run verify:bubble-snap
      - name: Cursor Ultra contract
        run: npm run verify:cursor-ultra
      - name: Cursor login contract
        run: npm run verify:cursor-login
      - name: Provider card navigation behavior
        run: npm run verify:provider-navigation
      - name: Frontend build
        run: npm run vite -- build
      - name: Rust tests
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-latest
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - run: npm ci
      - name: Build Windows application
        if: runner.os == 'Windows'
        run: npm run build
      - name: Verify rendered Windows bubble
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/verify-rendered-bubble.ps1 -Executable src-tauri/target/release/metra.exe
      - name: Validate Apple release secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for required in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required Apple release secret: ${required}" >&2
              exit 1
            fi
          done
      - name: Build signed Universal macOS application
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build -- --target universal-apple-darwin
      - name: Notarize and staple macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app_version="$(node -p "require('./package.json').version")"
          dmg_path="src-tauri/target/universal-apple-darwin/release/bundle/dmg/Metra_${app_version}_universal.dmg"

          xcrun notarytool submit "${dmg_path}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${dmg_path}"
      - name: Verify Universal architecture, Developer ID, and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_version="$(node -p "require('./package.json').version")"
          app_path="src-tauri/target/universal-apple-darwin/release/bundle/macos/Metra.app"
          app_binary="${app_path}/Contents/MacOS/metra"
          dmg_path="src-tauri/target/universal-apple-darwin/release/bundle/dmg/Metra_${app_version}_universal.dmg"
          release_dmg_path="src-tauri/target/universal-apple-darwin/release/bundle/dmg/Metra-${app_version}-macos-universal.dmg"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${app_version}"
          fi

          test -d "${app_path}"
          test -f "${dmg_path}"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "${app_path}/Contents/Info.plist")" = "${app_version}"
          test "$(plutil -extract CFBundleVersion raw -o - "${app_path}/Contents/Info.plist")" = "${app_version}"
          lipo "${app_binary}" -verify_arch arm64 x86_64

          codesign --verify --deep --strict --all-architectures --verbose=4 "${app_path}"
          signature_details="$(codesign -d --verbose=4 "${app_path}" 2>&1)"
          grep -q '^Authority=Developer ID Application:' <<<"${signature_details}"
          grep -Eq '^TeamIdentifier=[A-Z0-9]{10}$' <<<"${signature_details}"
          grep -Eq 'flags=.*runtime' <<<"${signature_details}"
          spctl --assess --type execute --verbose=4 "${app_path}"
          xcrun stapler validate "${app_path}"

          codesign --verify --verbose=4 "${dmg_path}"
          hdiutil verify "${dmg_path}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg_path}"
          xcrun stapler validate "${dmg_path}"
          cp "${dmg_path}" "${release_dmg_path}"
          shasum -a 256 "${release_dmg_path}" > macos-universal-sha256.txt
      - name: Collect portable Windows executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item src-tauri/target/release/metra.exe src-tauri/target/release/Metra-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: metra-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/Metra-portable.exe
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
            macos-universal-sha256.txt
          if-no-files-found: error
