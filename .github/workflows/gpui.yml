name: GPUI migration checks
on:
  push:
    branches: [feat/gpui-desktop-migration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux platform dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libssl-dev libasound2-dev libvulkan-dev mesa-vulkan-drivers xvfb dbus-x11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            desktop-gpui -> target
      - run: cargo test --locked --no-default-features --all-targets
      - run: cargo check --locked --manifest-path desktop-gpui/Cargo.toml --all-targets --features native-smoke
      - run: cargo test --locked --manifest-path desktop-gpui/Cargo.toml
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build native lifecycle smoke
        run: cargo build --locked --manifest-path desktop-gpui/Cargo.toml --features native-smoke
      - name: Native lifecycle smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a node scripts/smoke-gpui.mjs
          dbus-run-session -- xvfb-run -a node scripts/smoke-gpui.mjs --legacy-status
      - name: Native lifecycle smoke (macOS/Windows)
        if: runner.os != 'Linux'
        run: |
          node scripts/smoke-gpui.mjs
          node scripts/smoke-gpui.mjs --legacy-status
      - name: Inactive native bubble repaint (macOS)
        if: runner.os == 'macOS'
        env:
          METRA_IDLE_SMOKE_SECONDS: 330
        run: node scripts/smoke-gpui.mjs --idle
      - name: Native bubble repaint (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke-gpui.mjs --idle
      - name: Native composited surfaces (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke-gpui.mjs --pixels
      - name: Native bubble repaint (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node scripts/smoke-gpui.mjs --idle
      - name: Build experimental native installer
        run: node scripts/package-gpui.mjs --debug --output native-installer
      - name: Verify legacy Windows silent upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item native-installer/* release-assets/
          ./scripts/test-windows-upgrade.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: gpui-experimental-${{ runner.os }}
          path: native-installer/*
          retention-days: 7
      - name: Native pixel evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: gpui-native-pixels-Windows
          path: test-results/native-gpui-windows/*
          retention-days: 7
