name: GPUI migration checks
on:
  push:
    branches: [feat/gpui-desktop-migration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux platform dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libssl-dev libasound2-dev libvulkan-dev mesa-vulkan-drivers xvfb dbus-x11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            desktop-gpui -> target
      - run: cargo test --locked --no-default-features --all-targets
      - run: cargo check --locked --manifest-path desktop-gpui/Cargo.toml --all-targets --features native-smoke
      - run: cargo test --locked --manifest-path desktop-gpui/Cargo.toml
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build native lifecycle smoke
        run: cargo build --locked --manifest-path desktop-gpui/Cargo.toml --features native-smoke
      - name: Native lifecycle smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a node scripts/smoke-gpui.mjs
          dbus-run-session -- xvfb-run -a node scripts/smoke-gpui.mjs --legacy-status
      - name: Native lifecycle smoke (macOS/Windows)
        if: runner.os != 'Linux'
        run: |
          node scripts/smoke-gpui.mjs
          node scripts/smoke-gpui.mjs --legacy-status
      - name: Inactive native bubble repaint (macOS)
        if: runner.os == 'macOS'
        env:
          METRA_IDLE_SMOKE_SECONDS: 330
        run: node scripts/smoke-gpui.mjs --idle
      - name: Native bubble repaint (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke-gpui.mjs --idle
      - name: Native composited surfaces (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke-gpui.mjs --pixels
      - name: Native bubble repaint (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node scripts/smoke-gpui.mjs --idle
      - name: Build experimental native installer
        run: node scripts/package-gpui.mjs --debug --output native-installer
      - name: Verify published Windows installations and silent upgrades
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item native-installer/* release-assets/
          foreach ($baseline in @('0.2.2', '0.5.18', '0.6.0')) {
            ./scripts/test-windows-upgrade.ps1 -BaselineVersion $baseline
          }
      - name: Verify retained macOS disk images and SQLite compatibility
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fixtures=$(mktemp -d)
          mount="$fixtures/volume"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true; rm -rf "$fixtures"' EXIT
          mkdir -p "$mount"
          candidate="target/gpui-package/debug/bundle/macos/Metra.app/Contents/MacOS/metra"
          for version in 0.5.18 0.6.0; do
            name="Metra-$version-macos-universal.dmg"
            gh release download "v$version" --pattern "$name" --pattern "$name.sha256" --dir "$fixtures"
            (cd "$fixtures" && shasum -a 256 -c "$name.sha256")
            hdiutil verify "$fixtures/$name"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$fixtures/$name"
            app="$mount/Metra.app"
            test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = dev.metra.desktop
            test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "$version"
            codesign --verify --deep --strict "$app"
            lipo "$app/Contents/MacOS/metra" -verify_arch arm64 x86_64
            node scripts/test-packaged-settings.mjs "$app/Contents/MacOS/metra" "$candidate"
            hdiutil detach "$mount"
          done
      - name: Verify published Debian and Omarchy packages and the candidate
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fixtures=$(mktemp -d)
          trap 'rm -rf "$fixtures"' EXIT
          dpkg-deb -x native-installer/*-linux-x64.deb "$fixtures/candidate"
          candidate="$fixtures/candidate/usr/bin/metra"
          cargo build --locked --no-default-features
          METRA_COLLECTOR_BINARY=target/debug/metra node scripts/package-omarchy.mjs
          tar -xf release-assets/*-omarchy-x64.tar.gz -C "$fixtures"
          node scripts/verify-omarchy.mjs "$fixtures"/Metra-*-omarchy-x64/metra.usage/metra
          for version in 0.5.18 0.6.0; do
            staged="$fixtures/$version"
            mkdir -p "$staged"
            gh release download "v$version" --pattern '*-linux-x64.deb*' --pattern '*-omarchy-x64.tar.gz*' --dir "$staged"
            (cd "$staged" && sha256sum -c ./*.sha256)
            dpkg-deb -x "$staged"/*-linux-x64.deb "$staged/deb"
            tar -xf "$staged"/*-omarchy-x64.tar.gz -C "$staged"
            node scripts/test-packaged-settings.mjs "$staged/deb/usr/bin/metra" "$candidate"
            node scripts/test-packaged-settings.mjs "$staged"/Metra-*-omarchy-x64/metra.usage/metra "$fixtures"/Metra-*-omarchy-x64/metra.usage/metra
            node scripts/verify-omarchy.mjs "$staged"/Metra-*-omarchy-x64/metra.usage/metra
          done
      - uses: actions/upload-artifact@v6
        with:
          name: gpui-experimental-${{ runner.os }}
          path: native-installer/*
          retention-days: 7
      - name: Native pixel evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: gpui-native-pixels-Windows
          path: test-results/native-gpui-windows/*
          retention-days: 7
